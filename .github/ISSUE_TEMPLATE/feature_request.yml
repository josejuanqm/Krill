name: Feature Request
description: Suggest a new feature or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea for Krill? We'd love to hear it.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Dashboard
        - Environments
        - Containers
        - Stacks
        - User Management
        - Registries
        - Settings
        - Navigation / UX
        - Multi-server
        - New Portainer feature support
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What would you like?
      placeholder: Describe the feature or improvement you'd like to see.
    validations:
      required: true

  - type: textarea
    id: use-case
    attributes:
      label: Use case
      placeholder: Why would this be useful? What problem does it solve for you?
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Does this apply to a specific platform?
      options:
        - All platforms
        - iOS
        - macOS
        - Android
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Have you tried any workarounds or alternative approaches?
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: Mockups / Screenshots
      description: If you have any visual ideas, attach them here.
    validations:
      required: false
